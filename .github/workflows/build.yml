name: Build Executable iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Xcode Project
        run: |
          xcodebuild build \
            -project car_test.xcodeproj \
            -scheme car_test \
            -sdk iphoneos \
            -configuration Release \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Playable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          rm -rf Payload/*.app/_CodeSignature
          zip -r car_test_ready.ipa Payload

      - name: Upload Executable IPA
        uses: actions/upload-artifact@v4
        with:
          name: car_test_ready.ipa
          path: car_test_ready.ipa
